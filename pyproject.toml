[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "radle-benchmark"
version = "0.1.0"
description = "Private staging of the RadLE v2 inference companion"
requires-python = ">=3.10"
dependencies = ["openai==2.26.0", "Pillow==12.1.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
radle = ["resources/*.txt", "resources/*.json"]

